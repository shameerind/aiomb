# mrepod daemon configuration
#
# Default overlayroot directory. Policies that do not specify their own
# overlayroot will use this value.  Upper and work directories for each
# sandbox are created under this path.
#overlayroot = /ecloud-tmp/.cache
overlayroot = /b/workspace/.cache

# Optional: comma-separated sandbox-relative directory list for post-mount
# recursive chown. Example: post_mount_chown_dirs = .repo,.cache/worktrees,tmp
post_mount_chown_dirs =

# Optional: comma-separated sandbox-relative directory patterns to whiteout
# before mounting. Only directories are whiteouted. Supports wildcards,
# including ** across path segments. Example:
# post_mount_whiteout_dirs = obj,tmp/**/obj-*,**/junos-proxies/security/jweb/obj-arm
post_mount_whiteout_dirs = **/obj-*

# ---- ML Inference Sidecar ----
# Enable or disable ML-based server selection and anomaly detection.
# When disabled (0), the daemon uses default hardcoded logic.
# When enabled (1), the daemon queries the Python inference server.
ml_enabled = 0

# UNIX socket path for the inference server (model/inference_server.py)
model_socket = /run/mrepod/model.sock

# Comma-separated list of NFS server hostnames in the pool.
# The ML server selector will choose among these.
# nfs_servers = nfs1.example.com,nfs2.example.com,nfs3.example.com
nfs_servers =
